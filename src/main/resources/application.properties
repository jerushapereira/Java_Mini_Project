spring.application.name=smart-expense-budget-tracker
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${DB_USERNAME:expense}
spring.datasource.password=${DB_PASSWORD:expense}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.default-property-inclusion=non_null
currency.api.base-url=https://api.frankfurter.dev/v2
currency.cache-ttl=PT6H
currency.connect-timeout=PT3S
currency.request-timeout=PT4S
