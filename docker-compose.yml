services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expense_tracker}
      POSTGRES_USER: ${DB_USERNAME:-expense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-expense}
    ports:
      - "5432:5432"
    volumes:
      - expense_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  expense_data:
